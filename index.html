<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VarzXPaste</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; min-height: 100vh; }
  body { color: #00ff88; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 14px; line-height: 1.6; }
  .header { position: sticky; top: 0; background: #000; border-bottom: 1px solid #1a1a1a; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; z-index: 10; flex-wrap: wrap; gap: 8px; }
  .header .left { display: flex; align-items: center; gap: 12px; }
  .header .slug { color: #00ff88; font-weight: bold; }
  .header .meta { color: #333; font-size: 0.9em; }
  .header .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .header button { background: #0a0a0a; border: 1px solid #1a1a1a; color: #00ff88; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.85em; transition: all 0.2s; }
  .header button:hover { background: #00ff88; color: #000; border-color: #00ff88; }
  .terminal { padding: 20px; white-space: pre-wrap; word-break: break-word; color: #00ff88; font-size: 0.9em; counter-reset: line; padding-bottom: 60px; }
  .line { display: block; position: relative; padding-left: 55px; }
  .line::before { content: counter(line); counter-increment: line; position: absolute; left: 0; width: 45px; text-align: right; color: #333; user-select: none; }
  .welcome { padding: 40px 20px; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; }
  .welcome .prompt { color: #00ff88; }
  .welcome .dim { color: #333; }
  .welcome .red { color: #ff3366; }
  .blink { display: inline-block; width: 10px; height: 18px; background: #00ff88; animation: blink 1s steps(2) infinite; vertical-align: middle; margin-left: 4px; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #1a1a1a; padding: 8px 20px; font-size: 0.8em; color: #333; display: flex; justify-content: space-between; }
  .footer .status { color: #00ff88; }
  .footer .status.err { color: #ff3366; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #00ff88; }
  @media (max-width: 600px) {
    .header { padding: 8px 12px; font-size: 0.75em; }
    .header button { padding: 5px 10px; font-size: 0.8em; }
    .terminal { padding: 15px; font-size: 0.8em; }
    .line { padding-left: 40px; }
    .line::before { width: 32px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="welcome">
    <div><span class="prompt">varzx@paste:~$</span> <span class="dim">loading...</span></div>
    <br>
    <div><span class="prompt">varzx@paste:~$</span> <span class="blink"></span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDp_3SDiQUAGX0_gw8BYtO2Ecnypl1GlgE",
  authDomain: "project1-f57d6.firebaseapp.com",
  databaseURL: "https://project1-f57d6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "project1-f57d6",
  storageBucket: "project1-f57d6.firebasestorage.app",
  messagingSenderId: "722737960517",
  appId: "1:722737960517:web:f465039879d08fa306b52c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getSlug() {
  const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
  if (!path || path === "index.html" || path.startsWith("raw/")) return null;
  return path.split("/")[0];
}

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  const app = document.getElementById("app");
  const slug = getSlug();

  if (!slug) {
    app.innerHTML = `
      <div class="welcome">
        <div><span class="prompt">varzx@paste:~$</span> <span class="dim">cat /etc/varzx/status</span></div>
        <br>
        <div><span class="dim">─────────────────────────────</span></div>
        <div>  SERVICE : VarzXPaste</div>
        <div>  STATUS  : <span class="prompt">● ONLINE</span></div>
        <div>  VERSION : 1.0.0</div>
        <div>  <span class="dim">─────────────────────────────</span></div>
        <div>  USAGE:</div>
        <div>    <span class="dim">View :</span> /&lt;slug&gt;</div>
        <div>    <span class="dim">Raw  :</span> /raw/&lt;slug&gt;</div>
        <div>  <span class="dim">─────────────────────────────</span></div>
        <br>
        <div><span class="prompt">varzx@paste:~$</span> <span class="blink"></span></div>
      </div>
      <div class="footer"><span>VarzXPaste</span><span class="status">● ONLINE</span></div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="welcome">
      <div><span class="prompt">varzx@paste:~$</span> <span class="dim">fetching ${escapeHtml(slug)}...</span></div>
      <br>
      <div><span class="prompt">varzx@paste:~$</span> <span class="blink"></span></div>
    </div>
    <div class="footer"><span>VarzXPaste</span><span class="status">● LOADING</span></div>
  `;

  db.ref("pastes/" + slug).once("value")
    .then(snapshot => {
      const data = snapshot.val();

      if (!data || !data.code) {
        app.innerHTML = `
          <div class="welcome">
            <div><span class="red">varzx@paste:~$</span> <span class="dim">cat /pastes/${escapeHtml(slug)}</span></div>
            <br>
            <div><span class="red">[ ERROR 404 ]</span></div>
            <div class="dim">Paste not found atau udah dihapus.</div>
            <br>
            <div><span class="prompt">varzx@paste:~$</span> <span class="blink"></span></div>
          </div>
          <div class="footer"><span>VarzXPaste</span><span class="status err">● NOT FOUND</span></div>
        `;
        return;
      }

      db.ref("pastes/" + slug + "/views").transaction(v => (v || 0) + 1).catch(() => {});

      const content = data.code;
      const lines = content.split("\n").map(l => `<span class="line">${escapeHtml(l) || " "}</span>`).join("");
      const viewUrl = window.location.origin + "/" + slug;
      const loadstring = 'loadstring(game:HttpGet("' + window.location.origin + "/raw/" + slug + '"))()';

      app.innerHTML = `
        <div class="header">
          <div class="left">
            <span class="slug">/${escapeHtml(slug)}</span>
            <span class="meta">${content.length} chars</span>
          </div>
          <div class="actions">
            <button onclick="copyRaw()">Copy Raw URL</button>
            <button onclick="copyLS()">Copy Loadstring</button>
          </div>
        </div>
        <div class="terminal">${lines}</div>
        <div class="footer"><span>VarzXPaste</span><span class="status">● ONLINE</span></div>
      `;

      window.__varzx_loadstring = loadstring;
      window.__varzx_rawurl = window.location.origin + "/raw/" + slug;
    })
    .catch(e => {
      app.innerHTML = `
        <div class="welcome">
          <div><span class="red">varzx@paste:~$</span> <span class="dim">error</span></div>
          <br>
          <div><span class="red">[ CONNECTION ERROR ]</span></div>
          <div class="dim">${escapeHtml(e.message)}</div>
          <br>
          <div><span class="prompt">varzx@paste:~$</span> <span class="blink"></span></div>
        </div>
        <div class="footer"><span>VarzXPaste</span><span class="status err">● OFFLINE</span></div>
      `;
    });
}

function copyRaw() {
  navigator.clipboard.writeText(window.__varzx_rawurl || "").then(() => flash("Copied Raw URL!"));
}

function copyLS() {
  navigator.clipboard.writeText(window.__varzx_loadstring || "").then(() => flash("Copied Loadstring!"));
}

function flash(msg) {
  const btn = event.target;
  const original = btn.textContent;
  btn.textContent = "✓ " + msg;
  btn.style.background = "#00ff88";
  btn.style.color = "#000";
  setTimeout(() => {
    btn.textContent = original;
    btn.style.background = "";
    btn.style.color = "";
  }, 1500);
}

window.addEventListener("load", render);
</script>
</body>
</html>
